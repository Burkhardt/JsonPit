name: Publish NuGet
run-name: Publish ${{ inputs.release_ref || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing immutable release tag to publish (vX.Y.Z)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}

    steps:
      - name: Validate release tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release ref must be an immutable vX.Y.Z tag."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_REF }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag matches csproj version
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_REF#v}"
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' JsonPit.csproj | head -n 1)
          echo "Release commit: $(git rev-parse HEAD)"
          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${CSPROJ_VERSION}"
          if [[ "${TAG_VERSION}" != "${CSPROJ_VERSION}" ]]; then
            echo "Tag version does not match JsonPit.csproj <Version>."
            exit 1
          fi

      - name: Restore
        run: dotnet restore JsonPit.csproj

      - name: Build
        run: dotnet build JsonPit.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack JsonPit.csproj --configuration Release --no-build --output artifacts

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Burkhardt

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
